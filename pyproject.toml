[project]
name = "instay-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "Tien Hai",email = "tienhai2808@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "catboost (>=1.2.8,<2.0.0)",
    "grpcio (>=1.80.0,<2.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "protobuf (>=7.34.1,<8.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "safetensors (>=0.8.0,<0.9.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "sentencepiece (>=0.2.1,<0.3.0)",
    "torch (>=2.15.0,<3.0.0)",
    "transformers (>=5.22.1,<6.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.11,<0.16.0)"
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }
